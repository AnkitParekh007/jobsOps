name: Publish review-first developer preview

on:
  push:
    branches:
      - release/review-first-v0.1.0

permissions:
  contents: write

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.0-review-first.1
      VERIFIED_MAIN_SHA: ca21952c238db2bf4afa7e58261554824d4f21a0
    steps:
      - name: Checkout audited merge commit
        uses: actions/checkout@v4
        with:
          ref: ca21952c238db2bf4afa7e58261554824d4f21a0
          persist-credentials: false
      - name: Verify release target has not moved
        run: |
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$actual" = "$VERIFIED_MAIN_SHA" || {
            echo "main moved; refusing release without fresh review"
            exit 1
          }
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build installable artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
          jobops review-live --help
          jobops discover-live --help
      - name: Create explicit developer prerelease
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing duplicate publication"
            exit 1
          fi
          cat > RELEASE_NOTES.md <<'NOTES'
          # JobOps v0.1.0 — Review-First Developer Preview
          
          This **experimental, read-only developer preview** provides installable Python CLI workflows for local candidate workspace initialization, supported public Greenhouse/Lever ATS board discovery and human review queues.
          
          ### Included
          - `jobops init`, `jobops doctor`, `jobops discover-live` and `jobops review-live`.
          - Public ATS posting evidence including source URL, fetch time, response hash and stable requisition identity.
          - Optional private SQLite deduplication, failure classification, bounded fetches and role-keyword filtering.
          - Conservative `Needs review` results; no inferred sponsorship, visa/work rights, remote restrictions, or mandatory qualifications.
          - Wheel and sdist packages, verified by Python 3.11 / 3.12 release-candidate package CI.
          
          ### Safety restrictions and important limitations
          - **NOT a certified production release. NOT an automated application tool.**
          - **DO NOT enable live submission, outbound outreach, or unsandboxed third-party agent execution.**
          - No application submission, browser session, login, authenticated portal access or outreach capability is certified.
          - Source boards must be expressly configured; follow provider terms and do a real live-board acceptance check before relying on a board.
          - No independent OS-specific installation audit or security audit has yet been completed.
          - No real-time eligibility, portal status, employer sponsorship, or work rights are guaranteed.
          - `--dry-run` may write local state; use `--preview` for a non-mutating plan.
          
          For setup, see the repository `README.md`, `docs/PHASE-5-LIVE-DISCOVERY.md`, `docs/REVIEW-FIRST-RELEASE.md` and `docs/PRODUCTION-READINESS.md`.
          
          **Scope: developer preview only.** Independent acceptance is required before any production or autonomous external-action claims.
          NOTES
          gh release create "$TAG" dist/* \
            --target "$VERIFIED_MAIN_SHA" \
            --prerelease \
            --title "JobOps v0.1.0 — Review-First Developer Preview" \
            --notes-file RELEASE_NOTES.md
