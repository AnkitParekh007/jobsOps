name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest + contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements.txt
      - name: Contract schema load
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("contracts")
          assert root.is_dir(), "contracts/ missing"
          for p in sorted(root.glob("*.schema.json")):
              json.loads(p.read_text(encoding="utf-8"))
              print("ok", p.name)
          print("schemas", len(list(root.glob('*.schema.json'))))
          PY
      - name: Pytest
        env:
          JOBOPS_ALLOW_SUBMIT: "0"
          JOBOPS_ENABLE_LIVE_SUBMIT: "0"
          JOBOPS_ENABLE_OUTREACH_SEND: "0"
          JOBOPS_RUNTIME: deterministic
        run: python -m pytest -q
      - name: CLI smoke
        run: |
          python -m jobops.cli doctor || true
          python -m jobops.cli init --workspace "$RUNNER_TEMP/jobops-home" --name "Alex Candidate" --countries "Remote"
          python -m jobops.cli doctor --workspace "$RUNNER_TEMP/jobops-home"
          # agent_runtime must import after editable install (py-modules from lib/).
          python - <<'PY'
          from agent_runtime import (
              FORBIDDEN_FLAGS,
              detect_all,
              resolve_allowed_tools,
              ToolPermissionError,
          )
          assert "--force" in FORBIDDEN_FLAGS and "--trust" in FORBIDDEN_FLAGS
          assert "browser" not in resolve_allowed_tools("discovery")
          try:
              resolve_allowed_tools("discovery", ["submit"])
              raise SystemExit("discovery must not resolve submit")
          except ToolPermissionError:
              pass
          print("runtime_ok", len(detect_all()))
          PY

  lint-security:
    name: lint + security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff bandit
      - name: Ruff check
        run: |
          python -m ruff check lib jobops tests --select E,F,W --ignore E501
      - name: Bandit (high severity gate)
        run: |
          # Bandit exits non-zero when any finding matches -ll; keep JSON export
          # non-fatal so the severity gate below is the source of truth.
          python -m bandit -q -r lib jobops -ll || true
          python -m bandit -q -r lib jobops -ll -f json -o bandit.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("bandit.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("bandit.json missing or empty after scan")
          data = json.loads(path.read_text(encoding="utf-8"))
          high = [r for r in data.get("results", []) if r.get("issue_severity") == "HIGH"]
          print("high_findings", len(high))
          for r in high[:20]:
              print(r.get("filename"), r.get("issue_text"))
          # Fail only on high severity in application code
          raise SystemExit(1 if high else 0)
          PY
      - name: Secret / personal-data scan (tracked paths)
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path
          roots = [Path("lib"), Path("agents"), Path("jobops"), Path("SYSTEM.md"), Path("README.md"), Path("harness-contract.md")]
          patterns = [
              re.compile(r"ankit77parekh@gmail\.com", re.I),
              re.compile(r"ankitparekh007\.github\.io/resume", re.I),
              # Actual unrestricted invoke (docs may mention the ban).
              re.compile(r"agent\s+[^\n]*--force[^\n]*--trust"),
              re.compile(r"agent\s+[^\n]*--trust[^\n]*--force"),
          ]
          hits = []
          for root in roots:
              paths = [root] if root.is_file() else list(root.rglob("*"))
              for p in paths:
                  if not p.is_file():
                      continue
                  if "__pycache__" in p.parts or p.suffix in {".pyc", ".pyo"}:
                      continue
                  if p.suffix not in {".py", ".md", ".json", ".yml", ".yaml", ".toml", ""} and p.name != "run":
                      continue
                  try:
                      text = p.read_text(encoding="utf-8", errors="ignore")
                  except OSError:
                      continue
                  for pat in patterns:
                      if pat.search(text):
                          hits.append(f"{p}:{pat.pattern}")
          if hits:
              print("FORBIDDEN_HITS")
              print("\n".join(hits))
              sys.exit(1)
          print("personal_data_scan_ok")
          PY
