name: Deploy JobOps React website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web-react/**"
      - ".github/workflows/deploy-marketing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, pre-render and publish React website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install React dependencies
        run: npm install --no-audit --no-fund
      - name: Test source-content parity and metadata
        run: npm test
      - name: Build and pre-render crawlable HTML
        run: npm run build
      - name: Configure existing GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only React production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-react/dist
      - name: Allow Pages artifact metadata to propagate
        run: sleep 25
      - name: Publish GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
