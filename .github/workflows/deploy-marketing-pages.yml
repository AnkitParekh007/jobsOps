name: Deploy JobOps marketing site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-marketing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish website/ to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate JavaScript and no-network static checks
        run: |
          node --check website/assets/app.js
          node --check website/assets/theme-init.js
          python website/tests/static_check.py
      - name: Configure or enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website folder only
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
