name: Marketing site checks

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/marketing-site.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/marketing-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax validation
        run: |
          node --check website/assets/app.js
          node --check website/assets/theme-init.js
      - name: Static accessibility, route, contrast and safety checks
        run: python website/tests/static_check.py

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium for real browser tests
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Desktop/mobile browser acceptance
        run: python website/tests/browser_smoke.py
      - name: Attach viewport screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobops-website-browser-evidence
          path: website-audit/
          if-no-files-found: ignore
          retention-days: 14

# Cloudflare Pages is NOT configured or deployed by this workflow.
# See website/CLOUDFLARE-PAGES.md for owner-controlled hosting steps.
